<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>АЛМАТА НАХУЙ — уличный beat'em'up</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#08080d;overflow:hidden;touch-action:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #stage{position:relative;line-height:0}
  #game{display:block;background:#000}
  #hint{color:#7c7c8c;font:13px "Courier New",monospace;letter-spacing:1px;text-align:center;line-height:1.6}
  #hint b{color:#d8d8e4}
  /* ---------- системные кнопки (fullscreen / звук) ---------- */
  #sysbtns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:60}
  #sysbtns button{position:relative;width:40px;height:40px;border-radius:50%;
    background:rgba(28,28,40,.85);border:2px solid #000;
    box-shadow:inset 0 3px 0 #34344c,inset 0 -3px 0 #06060c;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;pointer-events:auto}
  #sysbtns button:active{transform:scale(.92)}
  #sysbtns svg{width:20px;height:20px;fill:#b8b8c4}
  #btnSnd.off::after{content:'';position:absolute;left:8px;top:18px;width:24px;height:3px;
    background:#c03830;transform:rotate(-45deg)}
  /* ---------- сенсорный геймпад ---------- */
  #pad{position:fixed;inset:0;display:none;pointer-events:none;user-select:none;-webkit-user-select:none}
  #dp{position:absolute;left:16px;bottom:14px;width:146px;height:146px}
  .dk{position:absolute;pointer-events:auto;background:#191922;border:2px solid #000;
    box-shadow:inset 0 3px 0 #34344c,inset 0 -3px 0 #06060c;touch-action:none}
  .dk.u{left:48px;top:0;width:48px;height:54px;border-radius:10px 10px 0 0}
  .dk.d{left:48px;bottom:0;width:48px;height:54px;border-radius:0 0 10px 10px}
  .dk.l{left:0;top:48px;width:54px;height:48px;border-radius:10px 0 0 10px}
  .dk.r{right:0;top:48px;width:54px;height:48px;border-radius:0 10px 10px 0}
  .dk.c{left:48px;top:48px;width:50px;height:50px;border-radius:0;
    display:flex;align-items:center;justify-content:center;pointer-events:none}
  .dk.c i{display:block;width:12px;height:12px;border-radius:50%;background:#2e2e3e;
    box-shadow:inset 0 2px 0 #3c3c50}
  .dk::after{content:'';position:absolute}
  .dk.u::after{left:19px;top:16px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid #4c4c64}
  .dk.d::after{left:19px;bottom:16px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #4c4c64}
  .dk.l::after{left:16px;top:19px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid #4c4c64}
  .dk.r::after{right:16px;top:19px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:9px solid #4c4c64}
  .dk:active,.dk.on{background:#24242f}
  #ab{position:absolute;right:16px;bottom:16px;width:216px;height:100px}
  .abtn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #000;
    box-shadow:inset 0 4px 0 rgba(255,255,255,.16),inset 0 -5px 0 rgba(0,0,0,.55),0 4px 0 #000;
    touch-action:none}
  .abtn:active,.abtn.on{transform:translateY(3px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -3px 0 rgba(0,0,0,.6)}
  .bA{left:8px;bottom:34px;width:58px;height:58px;background:#c8982a}
  .bB{left:76px;bottom:2px;width:70px;height:70px;background:#c03830}
  .bC{left:158px;bottom:34px;width:58px;height:58px;background:#2a58b8}
  #stBtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    width:68px;height:18px;border-radius:9px;background:#26262e;border:2px solid #000;
    box-shadow:inset 0 3px 0 #3a3a48,inset 0 -2px 0 #0a0a10;pointer-events:auto;touch-action:none}
  #stBtn:active{box-shadow:inset 0 2px 0 #3a3a48}
  @keyframes stPulse{
    0%,100%{box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.5),
      0 0 0 0 rgba(230,60,45,0)}
    50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.5),
      0 0 20px 7px rgba(230,60,45,.75)}
  }
  @media (pointer:coarse){
    #pad{display:block} #hint{display:none}
    body{gap:0}
    body.await #stBtn{
      width:110px;height:30px;bottom:12px;background:#b03028;
      animation:stPulse 1.1s ease-in-out infinite;
    }
    /* портрет: не блокируем игру — просто подсказка и компактный пад */
    @media (orientation:portrait){
      body{justify-content:flex-start;padding-top:36px}
      #dp{transform:scale(.75);transform-origin:left bottom}
      #ab{transform:scale(.75);transform-origin:right bottom}
      body.await #stBtn{width:88px;height:24px}
    }
  }
  /* ненавязчивая подсказка в портрете */
  #portraitTip{display:none;position:fixed;top:6px;left:50%;transform:translateX(-50%);
    background:rgba(16,16,24,.8);color:#c8c8d4;border-radius:10px;padding:6px 14px;
    font:700 11px Rubik,sans-serif;letter-spacing:.5px;z-index:50;
    pointer-events:none;white-space:nowrap}
  @media (orientation:portrait) and (pointer:coarse){#portraitTip{display:block}}
  /* ---------- прелоадер ---------- */
  #loader{display:none;position:fixed;inset:0;z-index:200;background:#0a0a12;
    flex-direction:column;align-items:center;justify-content:center;gap:24px;
    font-family:Rubik,sans-serif}
  @media (pointer:coarse){#loader{display:flex}}
  #loader .lg{color:#f0e8d0;font-weight:900;font-size:34px;letter-spacing:1px;
    text-shadow:0 3px 0 #8a2020}
  #loader .sub{color:#8a8a99;font-size:13px;margin-top:-14px}
  #loader .bar{width:190px;height:6px;border-radius:3px;background:#1e1e2a;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:0;background:#c83030;border-radius:3px;
    animation:ldbar 1.1s ease .1s forwards}
  @keyframes ldbar{to{width:100%}}
  #loader .btns{display:none;flex-direction:column;gap:14px;align-items:center}
  #loader.ready .btns{display:flex}
  #loader.ready .bar{opacity:.3}
  #ldFs{padding:14px 36px;background:#b03028;border:2px solid #301010;color:#ffe060;
    border-radius:12px;font:800 16px Rubik,sans-serif;letter-spacing:1px;
    box-shadow:0 0 20px rgba(230,60,45,.55),inset 0 3px 0 rgba(255,255,255,.15);
    pointer-events:auto}
  #ldFs:active{transform:scale(.95)}
  #ldWin{background:none;border:none;color:#8a8a99;font:500 13px Rubik,sans-serif;
    text-decoration:underline;pointer-events:auto}
  #fsHint{display:none;color:#8a8a99;font-size:11.5px;max-width:280px;
    text-align:center;line-height:1.55}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="hint">
  <b>←↑↓→ / WASD</b> движение &nbsp;·&nbsp; <b>J</b> рука &nbsp;·&nbsp; <b>K</b> нога &nbsp;·&nbsp; <b>L</b> СУПЕР &nbsp;·&nbsp; <b>ENTER</b> старт/пауза &nbsp;·&nbsp; <b>M</b> звук
</div>

<div id="sysbtns">
  <button id="btnFs" title="Во весь экран">
    <svg viewBox="0 0 24 24"><path d="M4 4h6v3H7v3H4V4zm10 0h6v6h-3V7h-3V4zM4 14h3v3h3v3H4v-6zm13 0h3v6h-6v-3h3v-3z"/></svg>
  </button>
  <button id="btnSnd" data-k="MU" title="Звук">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 5V4L8 9H4zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM15 2.5v2.1c2.9.9 5 3.6 5 6.9s-2.1 6-5 6.9v2.1c4-1 7-4.5 7-9s-3-8-7-9z"/></svg>
  </button>
</div>
<div id="portraitTip">ПОВЕРНИ ТЕЛЕФОН ИЛИ НАЖМИ ⟰ СПРАВА</div>

<div id="pad">
  <div id="dp">
    <div class="dk u" data-k="U"></div>
    <div class="dk l" data-k="L"></div>
    <div class="dk r" data-k="R"></div>
    <div class="dk d" data-k="D"></div>
    <div class="dk c"><i></i></div>
  </div>
  <div id="ab">
    <div class="abtn bA" data-k="A2"></div>
    <div class="abtn bB" data-k="A1"></div>
    <div class="abtn bC" data-k="SU"></div>
  </div>
  <div id="stBtn" data-k="ST"></div>
</div>
<div id="loader">
  <div class="lg">АЛМАТА НАХУЙ</div>
  <div class="sub">уличная история</div>
  <div class="bar"><i></i></div>
  <div class="btns">
    <button id="ldFs">НА ВЕСЬ ЭКРАН</button>
    <button id="ldWin">играть в окне</button>
  </div>
  <div id="fsHint"></div>
</div>

<script>
'use strict';
const W=480,H=270,STEP=1/60;
const cv=document.getElementById('game');
const g=cv.getContext('2d');
const isCoarse=matchMedia('(pointer:coarse)').matches;
const EN=isCoarse?'START':'ENTER';
const RENT=150000;

function fit(){
  const dpr=window.devicePixelRatio||1;
  const aw=innerWidth, ah=innerHeight-(isCoarse?0:44);
  const cs=Math.min(aw/W,ah/H);
  const cw=Math.max(200,Math.floor(W*cs)),ch=Math.floor(H*(cw/W));
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  cv.__S=cv.width/W;
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
document.addEventListener('fullscreenchange',fit);
document.addEventListener('webkitfullscreenchange',fit);
fit();
if(document.fonts&&document.fonts.load)
  ['500 12px Rubik','700 12px Rubik','800 13px Rubik','900 22px Rubik','900 58px Rubik']
  .forEach(f=>document.fonts.load(f));

/* ---------- полный экран ----------
   Явный жест (click) + запрос fullscreen; при успехе мягко просим
   ландшафт (работает даже при системной блокировке авто-поворота).
   Кнопка ⟰ доступна всегда и работает как переключатель. */
function tryFS(cb,lock){
  const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){cb&&cb(true);return;}
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!fn){cb&&cb(false);return;}
  const done=()=>{
    if(lock&&screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('landscape').catch(()=>{});
    cb&&cb(true);
  };
  try{
    const r=fn.call(el);
    if(r&&r.then)r.then(done).catch(()=>cb&&cb(false));
    else setTimeout(()=>{
      if(document.fullscreenElement||document.webkitFullscreenElement)done();
      else cb&&cb(false);
    },400);
  }catch(e){cb&&cb(false);}
}
const btnFs=document.getElementById('btnFs');
btnFs.addEventListener('click',()=>{
  AU.init();
  if(document.fullscreenElement||document.webkitFullscreenElement){
    const ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(ex)ex.call(document);
  }else tryFS(null,true);
});
addEventListener('pointerdown',()=>{AU.init();},{passive:true});
addEventListener('keydown',()=>{AU.init();});

/* ---------- прелоадер ---------- */
(function(){
  const loader=document.getElementById('loader');
  if(!isCoarse){loader.style.display='none';return;}
  const ldFs=document.getElementById('ldFs');
  const ldWin=document.getElementById('ldWin');
  const fsHint=document.getElementById('fsHint');
  const start=()=>{loader.style.display='none';AU.init();};
  setTimeout(()=>{
    loader.classList.add('ready');
    if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){
      ldFs.textContent='ИГРАТЬ';
      ldWin.style.display='none';
      fsHint.style.display='block';
      fsHint.innerHTML='Полноэкранный режим недоступен в этом браузере.<br>'+
        'На iPhone: «Поделиться» → «На экран Домой» —<br>игра откроется без панелей браузера.';
    }
  },1200);
  ldFs.addEventListener('click',()=>{
    AU.init();
    if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){start();return;}
    tryFS(()=>start(),true);
  });
  ldWin.addEventListener('click',()=>{AU.init();start();});
})();

function syncBody(){
  const aw=['title','select','clear','gameover','win','pause'].includes(G.state)?1:0;
  const sig=aw?1:0;
  if(sig===G._bsig)return;
  G._bsig=sig;
  document.body.classList.toggle('await',!!aw);
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round(((n>>16)&255)*f),0,255),
        gg=clamp(Math.round(((n>>8)&255)*f),0,255),
        b=clamp(Math.round((n&255)*f),0,255);
  return `rgb(${r},${gg},${b})`;
}
function fmtT(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function el(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function poly(c,pts,w,col,dk){
  c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  if(dk){c.strokeStyle=dk;c.lineWidth=w+3.4;c.stroke();}
  c.strokeStyle=col;c.lineWidth=w;c.stroke();
}
function txt(str,x,y,font,col,align,base,sw,sc){
  g.font=font; g.textAlign=align||'center'; g.textBaseline=base||'middle';
  if(sw){g.lineJoin='round';g.lineWidth=sw;g.strokeStyle=sc||'rgba(12,10,18,.92)';g.strokeText(str,x,y);}
  g.fillStyle=col; g.fillText(str,x,y);
}
function vignette(){
  if(!G._vig){
    G._vig=g.createRadialGradient(W/2,H*.44,150,W/2,H*.44,340);
    G._vig.addColorStop(0,'rgba(0,0,0,0)');
    G._vig.addColorStop(1,'rgba(0,0,0,.30)');
  }
  g.fillStyle=G._vig;g.fillRect(0,0,W,H);
}
function levelTint(L){
  if(L.night){g.fillStyle='rgba(28,36,80,.10)';g.fillRect(0,0,W,H);}
  else if(L.sun){g.fillStyle='rgba(255,142,64,.07)';g.fillRect(0,0,W,H);}
}
function levelMusic(){return G.level>=3&&G.level<5?'tense':'game';}
function drawNote(px,py,col,alpha){
  g.globalAlpha=alpha;
  g.fillStyle=col;g.strokeStyle=col;g.lineWidth=1.3;g.lineCap='round';
  el(g,px,py,2.6,1.9);g.fill();
  g.beginPath();g.moveTo(px+2.3,py-.5);g.lineTo(px+2.3,py-7);g.stroke();
  g.beginPath();
  g.moveTo(px+2.3,py-7);g.lineTo(px+6.2,py-5.6);g.lineTo(px+2.3,py-4.6);
  g.closePath();g.fill();
  g.globalAlpha=1;
}

/* ---------------- ВВОД ---------------- */
const KEYMAP={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',
  KeyA:'L',KeyD:'R',KeyW:'U',KeyS:'D',
  KeyJ:'A1',KeyZ:'A1',Numpad1:'A1',KeyK:'A2',KeyX:'A2',Numpad2:'A2',
  KeyL:'SU',KeyC:'SU',Numpad3:'SU',
  Enter:'ST',KeyP:'PA',KeyM:'MU',Escape:'PA'};
const down={},hit={};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code]; if(!k)return;
  e.preventDefault();
  if(!down[k])hit[k]=1; down[k]=1;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code]; if(k)down[k]=0;});
document.querySelectorAll('#pad [data-k],#sysbtns [data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();AU.init();if(!down[k])hit[k]=1;down[k]=1;b.classList.add('on');};
  const off=()=>{down[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);
  b.addEventListener('pointerleave',off);
});
const press=k=>{const v=hit[k];hit[k]=0;return v;};

/* ---------------- ЗВУК ---------------- */
function mf(m){return 440*Math.pow(2,(m-69)/12);}
const PATS={
  title:{bpm:84, bass:[45,0,0,0,48,0,0,0,52,0,0,0,48,0,0,0], kick:[0,8], sn:[12]},
  game:{bpm:132,bass:[45,45,0,45,0,45,48,0,50,0,48,0,43,0,43,0], kick:[0,4,8,12], sn:[4,12]},
  tense:{bpm:142,bass:[40,40,0,40,0,40,43,0,45,0,43,0,38,0,38,38], kick:[0,4,8,10,12], sn:[4,12,14]},
  reggi:{bpm:76, bass:[45,0,0,45,0,0,52,0,48,0,0,48,0,0,50,0], kick:[8], sn:[8]},
};
const AU={
  ctx:null,mast:null,muted:false,cur:null,step:0,next:0,
  init(){ if(this.ctx)return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.mast=this.ctx.createGain(); this.mast.gain.value=.5;
      this.mast.connect(this.ctx.destination);
      this.next=this.ctx.currentTime+.1;
    }catch(e){}
  },
  toggle(){ this.muted=!this.muted; if(this.mast)this.mast.gain.value=this.muted?0:.5;
    const b=document.getElementById('btnSnd'); if(b)b.classList.toggle('off',this.muted); },
  now(){return this.ctx?this.ctx.currentTime:0;},
  osc(type,f0,f1,t0,dur,vol){
    const c=this.ctx; if(!c)return;
    const o=c.createOscillator(),gn=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    gn.gain.setValueAtTime(vol,t0); gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(gn); gn.connect(this.mast); o.start(t0); o.stop(t0+dur+.02);
  },
  noise(t0,dur,vol,fc,type){
    const c=this.ctx; if(!c)return;
    const len=Math.max(1,(dur*c.sampleRate)|0);
    const buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const n=c.createBufferSource(); n.buffer=buf;
    const f=c.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fc;
    const gn=c.createGain(); gn.gain.setValueAtTime(vol,t0);
    gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
    n.connect(f); f.connect(gn); gn.connect(this.mast); n.start(t0); n.stop(t0+dur+.02);
  },
  swing(){if(this.ctx)this.noise(this.now(),.06,.12,1800,'highpass');},
  punch(){if(!this.ctx)return;const t=this.now();this.noise(t,.08,.3,900);this.osc('square',120,60,t,.08,.25);},
  kick(){if(!this.ctx)return;const t=this.now();this.noise(t,.1,.35,700);this.osc('square',90,40,t,.12,.3);},
  hurt(){if(this.ctx)this.osc('sawtooth',300,90,this.now(),.18,.2);},
  fall(){if(!this.ctx)return;const t=this.now();this.osc('square',100,35,t,.25,.25);this.noise(t,.2,.25,500);},
  blip(){if(this.ctx)this.osc('square',700,700,this.now(),.05,.12);},
  confirm(){if(!this.ctx)return;const t=this.now();this.osc('square',520,780,t,.09,.15);},
  barkBig(){if(!this.ctx)return;const t=this.now();
    this.osc('sawtooth',220,55,t,.18,.42);this.noise(t,.14,.2,600);
    this.osc('sawtooth',240,70,t+.22,.18,.42);},
  whistle(){if(!this.ctx)return;const t=this.now();
    this.osc('sine',2200,2600,t,.13,.14);
    this.osc('sine',2600,1400,t+.15,.2,.14);},
  meow(){if(!this.ctx)return;const t=this.now();this.osc('sine',700,1050,t,.12,.15);this.osc('sine',1050,600,t+.13,.18,.15);},
  superGo(){if(!this.ctx)return;const t=this.now();this.osc('sawtooth',100,900,t,.25,.25);this.noise(t,.25,.2,3000,'highpass');},
  toke(){if(!this.ctx)return;const t=this.now();
    this.noise(t,.35,.12,700);this.osc('sine',280,520,t,.35,.1);},
  jing(up){if(!this.ctx)return;const t=this.now();
    (up?[52,56,59,64]:[40,38,35,31]).forEach((n,i)=>this.osc('square',mf(n),mf(n),t+i*.09,.12,.15));},
  chord(){
    const c=this.ctx; if(!c)return; const t=c.currentTime;
    const gn=c.createGain(); gn.gain.setValueAtTime(.55,t);
    gn.gain.exponentialRampToValueAtTime(.001,t+1);
    const sh=c.createWaveShaper(); const cu=new Float32Array(256);
    for(let i=0;i<256;i++){const x=i/128-1;cu[i]=Math.tanh(3*x);}
    sh.curve=cu; sh.connect(gn); gn.connect(this.mast);
    [82.4,110,164.8,220].forEach(f=>{
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;
      o.connect(sh);o.start(t);o.stop(t+1);
    });
  },
  set(name){ this.cur=PATS[name]||null; this.step=0;
    if(this.ctx)this.next=this.ctx.currentTime+.05; },
  tick(){
    const c=this.ctx; if(!c)return;
    if(!this.cur||this.muted){this.next=Math.max(this.next,c.currentTime);return;}
    const spb=60/this.cur.bpm/4;
    while(this.next<c.currentTime+.18){
      const p=this.cur,s=this.step,t=this.next;
      if(p.bass[s])this.osc('square',mf(p.bass[s]),mf(p.bass[s]),t,.14,.16);
      if(p.kick.includes(s))this.osc('sine',110,40,t,.1,.5);
      if(p.sn.includes(s))this.noise(t,.08,.22,1800,'bandpass');
      if(s%2===0)this.noise(t,.03,.07,8000,'highpass');
      this.step=(s+1)%16; this.next+=spb;
    }
  }
};

function buildLevel(i){
  const d=LEVELS[i],rng=mulberry(9137+i*101);
  const len=d.len*2;
  const waves=[];
  d.waves.forEach((wv,i2)=>{
    const nx=wv.x*2;
    waves.push({x:nx,e:wv.e});
    const next=i2+1<d.waves.length?d.waves[i2+1].x*2:len-320;
    waves.push({x:nx+(next-nx)/2+110,e:wv.e.slice()});
  });
  const L={...d,len,waves,blds:[],sils:[],props:[],cars:[],lamps:[],puddles:[],
    stars:[],clouds:[],stains:[],manholes:[],birds:[],bushes:[],cracks:[],joints:[]};
  let sx=-60;

    L.sils.push({x:sx,w:26+rng()*54|0,h:24+rng()*46|0});
    sx+=34+rng()*40;
  }
  let x=-30;
  while(x<len+60){
    const t=d.types[rng()*d.types.length|0];
    let w,h;
    if(t==='panel'){w=88+rng()*40|0;h=118;}
    else if(t==='brick'){w=70+rng()*36|0;h=74;}
    else if(t==='garage'){w=54+rng()*18|0;h=36;}
    else if(t==='kiosk'){w=56+rng()*14|0;h=46;}
    else if(t==='fence'){w=90+rng()*50|0;h=20;}
    else{w=64+rng()*20|0;h=28;}
    const b={x,w,h,t,c:['#565f70','#4a5568','#3f4a5c','#5e6a7a'][rng()*4|0]};
    if(t==='garage')b.c=['#3f5a4a','#4a5568','#5a4a3a','#3a4a5c'][rng()*4|0];
    if(t==='brick')b.c=['#6a3a34','#5c3430','#71423c'][rng()*3|0];
    if(t==='container')b.c=['#5a4a30','#4a5a3a','#3a4a5a'][rng()*3|0];
    b.win=[];b.pipe=false;b.ac=null;
    if(t==='panel'){
      for(let cy=8;cy<h-14;cy+=18)for(let cx=7;cx<w-12;cx+=16)
        if(rng()<.75)b.win.push({x:cx,y:cy,lit:rng()<.32});
      if(b.win.length&&rng()<.5)b.ac=b.win[(rng()*b.win.length)|0];
    }else if(t==='brick'){
      for(let cy=10;cy<h-20;cy+=24)for(let cx=10;cx<w-14;cx+=26)
        if(rng()<.6)b.win.push({x:cx,y:cy,lit:rng()<.28});
      b.pipe=rng()<.7;
    }else if(t==='kiosk'){
      b.sign=SIGNS[rng()*SIGNS.length|0];
      b.neon=NEON[rng()*NEON.length|0];
    }
    b.graf=[];
    if(t==='fence'){
      b.graf.push({x:8+rng()*30|0,c:NEON[rng()*NEON.length|0],s:rng()*6.28});
      if(rng()<.5)b.graf.push({x:40+rng()*30|0,c:NEON[rng()*NEON.length|0],s:rng()*6.28});
    }
    L.blds.push(b);
    x+=w+(rng()<.25?3:0);
  }
  if(d.home)L.blds.push({x:len-215,w:130,h:116,t:'home',win:[],graf:[]});
  for(let lx=90;lx<len;lx+=170+rng()*60)L.lamps.push({x:lx});

    else L.props.push({x:px,t:'hyd',y:160});

  for(let k=0;k<4;k++)L.joints.push({x:260+rng()*(len-520)|0,y:170+rng()*24|0,taken:false});
  return L;

function drawCloud(cx,cy,cw,dark){
  const body=dark?'rgba(40,44,62,.85)':'rgba(244,236,224,.9)';
  const sh=dark?'rgba(28,32,46,.7)':'rgba(178,156,148,.55)';
  g.fillStyle=sh;
  el(g,cx+cw*.2,cy+3,cw*.42,4);g.fill();
  el(g,cx+cw*.6,cy+3,cw*.3,3);g.fill();
  g.fillStyle=body;
  el(g,cx+cw*.5,cy,cw*.5,7);g.fill();
  el(g,cx+cw*.3,cy-4,cw*.3,6);g.fill();
  el(g,cx+cw*.68,cy-2,cw*.22,5);g.fill();
}

function skyFill(L,hMax){

  }
  g.fillStyle=L._sky;g.fillRect(0,0,W,hMax);
}

function mkPlayer(hero){

function mkEnemy(type,x,y){
  const d=ETYPES[type];
  return {def:d,type,x,footY:y,dir:-1,state:'chase',stateT:0,t:Math.random()*9,
    animPh:Math.random()*6,hp:d.hp,cd:.4+Math.random()*.8,stand:26+Math.random()*16,

}
function mkCat(x){return {x,y:186,dir:1,state:'sit',phase:0,t:0};}

function nearestEnemy(p,r){
  let best=null,bd=1e9;
  for(const e of G.enemies){
    if(['fly','lying','out'].includes(e.state))continue;
    const d=Math.abs(e.x-p.x);
    if(d<r&&d<bd){bd=d;best=e;}
  }
  return best;
}
function spark(x,y,n,col,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,v=sp*(.4+Math.random()*.6);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,g:380,life:.4+Math.random()*.2,max:.6,col,s:2.4});
  }
}

function damageEnemy(e,dmg,dir,kb){

function killEnemy(e,dir,power){

function hurtPlayer(dir){
  const p=G.player;
  if(p.iframes>0||p.state==='super'||p.state==='down')return;
  if(G.jointT>0)return;
  p.hp--;p.meter=Math.min(100,p.meter+16);
  AU.hurt();G.shake=Math.max(G.shake,3);G.combo=0;
  spark(p.x,p.footY-48,4,'#ff9060',50);

    p.hp=0;p.state='down';p.stateT=0;p.deadT=0;
    G.lives--;G.deadTimer=1.8;AU.jing(false);
  }else{
    p.state='hurt';p.stateT=0;p.iframes=1;p.x+=dir*28;
  }
}
function doPlayerHit(p){
  const range=(p.state==='kick'?62:52)*p.hero.range;
  let hitAny=false;
  for(const e of G.enemies){
    if(['fly','lying','out'].includes(e.state))continue;
    const dx=(e.x-p.x)*p.dir;
    if(dx>-14&&dx<range&&Math.abs(e.footY-p.footY)<26){
      hitAny=true;damageEnemy(e,1,p.dir,p.state==='kick'?38:20);
    }
  }
  if(hitAny){
    p.meter=Math.min(100,p.meter+22);
    G.freeze=Math.max(G.freeze,.045);G.shake=Math.max(G.shake,2);
    p.state==='kick'?AU.kick():AU.punch();
    G.combo++;G.comboT=1.2;
  }
}
function superHit(p,range,dy,power){
  for(const e of G.enemies){
    if(['fly','lying','out'].includes(e.state))continue;
    const dx=(e.x-p.x)*p.dir;
    if(dx>-14&&dx<range&&Math.abs(e.footY-p.footY)<dy)killEnemy(e,p.dir,power);
  }
}
function startSuper(){

  p.meter=0;p.state='super';p.stateT=0;p.sPh=0;p.sN=0;p.sT=0;p.tg=null;

const SUPERS={
 guitar(p,dt){

 },
 dog(p,dt){
  if(!p.sPh){p.sPh=1;spawnDog(p);}

 },
 fists(p,dt){

    p.sPh=1;
    const tg=nearestEnemy(p,270);
    if(tg){
      p.dir=tg.x>=p.x?1:-1;

    }
  }
  if(p.sPh===1){
    p.sT+=dt;
    if(p.sT>=.085){
      p.sT=0;p.sN++;
      if(p.tg&&!['fly','lying','out'].includes(p.tg.state)){
        p.tg.state='hurt';p.tg.stateT=0;
        p.tg.x+=(Math.random()<.5?-1:1)*2;
        spark(p.tg.x-p.tg.dir*10,p.tg.footY-48,3,'#ffd870',70);
        AU.punch();G.freeze=Math.max(G.freeze,.02);
      }
      if(p.sN>=9){
        p.sPh=2;
        if(p.tg&&!['fly','lying','out'].includes(p.tg.state))killEnemy(p.tg,p.dir,2.4);
        G.shake=8;AU.kick();
      }

  }
  if(p.stateT>=1.35)endSuper(p);
 },
};
function updateSuper(p,dt){
  SUPERS[p.hero.prop](p,dt);
  if(p.state==='super')p.z=0;
}
function endSuper(p){p.state='idle';p.stateT=0;p.sPh=0;p.z=0;}

/* ---------------- ОБНОВЛЕНИЕ ---------------- */
function updatePlayer(dt){
  const p=G.player;
  p.stateT+=dt;p.t+=dt;
  if(p.iframes>0)p.iframes-=dt;
  const busy=['punch','kick','super','hurt','down'].includes(p.state);
  if(!busy){
    let mx=(down.R?1:0)-(down.L?1:0),my=(down.D?1:0)-(down.U?1:0);
    if(mx||my){
      p.state='walk';
      const nn=Math.hypot(mx,my),spd=125*p.hero.speed;
      p.x+=mx/nn*spd*dt;p.footY+=my/nn*spd*.7*dt;
      p.footY=clamp(p.footY,158,200);
      if(mx)p.dir=mx;
      p.animPh+=spd*dt/13;
    }else p.state='idle';
    if(press('A1')){p.state='punch';p.stateT=0;p.hitDone=0;p.dur=.3;AU.swing();}
    else if(press('A2')){p.state='kick';p.stateT=0;p.hitDone=0;p.dur=.44;AU.swing();}
    else if(press('SU')&&p.meter>=100)startSuper();
  }else{
    if(p.state==='punch'||p.state==='kick'){
      if(!p.hitDone&&p.stateT>=p.dur*.35){p.hitDone=1;doPlayerHit(p);}
      if(p.stateT>=p.dur)p.state='idle';
    }
    else if(p.state==='hurt'&&p.stateT>.32)p.state='idle';
    else if(p.state==='super')updateSuper(p,dt);
    else if(p.state==='down')p.deadT+=dt;
  }
  p.meter=Math.min(100,p.meter+3.5*dt);
}
function updateEnemy(e,dt){
  e.stateT+=dt;e.t+=dt;
  if(e.flashT>0)e.flashT-=dt;
  if(e.tauntCd>0)e.tauntCd-=dt;
  const p=G.player;
  switch(e.state){
    case 'hurt':if(e.stateT>.26)e.state='chase';break;
    case 'fly':
      e.x+=e.vx*dt;e.z+=e.vz*dt;e.vz-=700*dt;
      if(e.z<=0){e.z=0;e.state='lying';e.stateT=0;
        spark(e.x,e.footY,4,'#9a9a9a',40);}
      break;
    case 'lying':if(e.stateT>.75){e.state='out';e.stateT=0;}break;
    case 'out':if(e.stateT>.4)e.dead=true;break;
    case 'windup':
      if(e.stateT>=e.def.windup){
        e.state='strike';e.stateT=0;e.dur=.14;
        const dx=(p.x-e.x)*e.dir;
        if(dx>-10&&dx<e.def.atk+14&&Math.abs(p.footY-e.footY)<22)hurtPlayer(e.dir);
      }
      break;
    case 'strike':if(e.stateT>.14){e.state='back';e.stateT=0;}break;
    case 'back':
      e.x-=e.dir*e.def.speed*.5*dt;e.animPh+=e.def.speed*dt/15;
      if(e.stateT>.4)e.state='chase';
      break;
    default:{
      if(e.cd>0)e.cd-=dt;
      const dx=p.x-e.x,dy=p.footY-e.footY;
      e.dir=dx>0?1:-1;
      const tX=p.x-e.dir*e.stand,sp=e.def.speed*(1+G.level*.03);
      if(Math.abs(tX-e.x)>2){e.x+=Math.sign(tX-e.x)*sp*dt;e.animPh+=sp*dt/13;}
      if(Math.abs(dy)>2)e.footY+=Math.sign(dy)*sp*.6*dt;
      e.footY=clamp(e.footY,158,200);
      if(Math.abs(dx)<e.def.atk+8&&Math.abs(dy)<22&&e.cd<=0&&p.state!=='down'&&G.state==='play'){
        e.state='windup';e.stateT=0;
        if(e.tauntCd<=0&&Math.random()<.35){
          e.tauntCd=4;
          addQuip(e.def.taunts[(Math.random()*e.def.taunts.length)|0],
            e.x,e.footY-92,14,'#e8e8f0');
        }
      }
      for(const o of G.enemies){
        if(o!==e&&!['fly','lying','out'].includes(o.state)){
          const dd=e.x-o.x;
          if(Math.abs(dd)<24&&Math.abs(e.footY-o.footY)<14)e.x+=Math.sign(dd||1)*40*dt;
        }
      }
      e.x=clamp(e.x,cam.x-50,cam.x+W+50);
    }
  }
}
function updateDog(dt){
  const d=G.dog;if(!d)return;
  d.phase+=dt*(d.big?16:18);
  const p=G.player;
  if(d.state==='run'){
    if(!d.target||['fly','lying','out'].includes(d.target.state))
      d.target=nearestEnemy(p,460);
    const tx=d.target?d.target.x:p.x+p.dir*160;
    const ty=d.target?d.target.footY:p.footY;
    d.dir=tx>d.x?1:-1;
    const dx=tx-d.x,dy=ty-d.y,nn=Math.hypot(dx,dy)||1;
    d.x+=dx/nn*460*dt;d.y+=dy/nn*350*dt;
    if(d.target&&nn<30){
      killEnemy(d.target,d.dir,2.6);
      AU.barkBig();
      spark(d.x,d.y-24,10,'#ffd870',100);
      d.target=null;
    }else if(!d.target&&nn<24)d.state='back';
  }else if(d.state==='back'){
    const tx=p.x-p.dir*34,ty=p.footY;
    d.dir=tx>d.x?1:-1;
    const dx=tx-d.x,dy=ty-d.y,nn=Math.hypot(dx,dy)||1;
    d.x+=dx/nn*460*dt;d.y+=dy/nn*350*dt;
    if(nn<34){d.state='sit';d.sitT=0;}
  }else if(d.state==='sit'){
    d.sitT+=dt;d.dir=p.dir;
    if(d.sitT>.8){d.alpha-=dt*2;if(d.alpha<=0)G.dog=null;}
  }
}
function updateCat(dt){
  const k=G.cat;if(!k)return;
  k.t+=dt;
  if(k.state==='sit'){
    if(Math.abs(G.player.x-k.x)<110&&Math.abs(G.player.footY-k.y)<50){
      k.state='flee';k.t=0;AU.meow();addQuip('МЯУ!',k.x,k.y-46,16,'#f0d0a0');
    }
  }else{
    k.x+=170*dt;k.phase+=dt*20;k.dir=1;
    if(k.t>2.4){k.state='sit';k.t=0;}
  }
}
function spawnWave(){
  const wv=G.lv.waves[G.waveIdx];
  wv.e.forEach((t,i)=>{
    const side=i%2?-1:1;
    G.enemies.push(mkEnemy(t,cam.x+(side<0?-36:W+36),160+Math.random()*36|0));
  });
  G.waveActive=true;
  G.lockX=Math.min(wv.x-W*.55,G.lv.len-W);
}
function initLevel(i){
  G.level=i;G.lv=buildLevel(i);
  G.waveIdx=0;G.waveActive=false;G.lockX=0;
  cam.x=0;G.enemies=[];G.parts=[];G.quips=[];G.pops=[];
  G.dog=null;G.combo=0;G.deadTimer=0;G.jointT=0;
  G.player.x=Math.max(G.player.x,40);G.player.footY=180;
  G.player.z=0;G.player.state='idle';G.player.stateT=0;
  G.cat=i===1?mkCat(760):null;
  G.rainDrops=[];
  if(G.lv.rain)for(let r=0;r<70;r++)
    G.rainDrops.push({x:Math.random()*W,y:Math.random()*H,v:280+Math.random()*120});
}
function updatePlay(dt){
  if(G.freeze>0){G.freeze-=dt;G.shake=Math.max(0,G.shake-dt*12);return;}
  G.shake=Math.max(0,G.shake-dt*12);
  if(G.flash>0)G.flash-=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  const p=G.player;
  updatePlayer(dt);
  for(let i=G.enemies.length-1;i>=0;i--){
    updateEnemy(G.enemies[i],dt);
    if(G.enemies[i].dead)G.enemies.splice(i,1);
  }
  updateDog(dt);updateCat(dt);
  for(const car of G.lv.cars){
    car.x+=car.sp*car.dir*dt;
    if(car.dir>0&&car.x>G.lv.len+90)car.x=-90;
    if(car.dir<0&&car.x<-90)car.x=G.lv.len+90;
  }
  for(const j of G.lv.joints){
    if(j.taken)continue;
    if(Math.abs(p.x-j.x)<18&&Math.abs(p.footY-j.y)<18){
      j.taken=true;G.jointT=7;AU.toke();
      addQuip(['ПРИКУРИЛ!','ОХ, ХОРОШО!'][(Math.random()*2)|0],p.x,p.footY-104,18,'#a0e8a0');
      spark(j.x,j.y-6,8,'#a0e8a0',50);
      AU.set('reggi');
    }
  }
  if(G.jointT>0){
    G.jointT-=dt;
    if(G.jointT<=0){G.jointT=0;AU.set(levelMusic());}
    else{
      G.smokeJ-=dt;
      if(G.smokeJ<=0){
        G.smokeJ=.15;
        G.parts.push({x:p.x+4*p.dir,y:p.footY-84,vx:8*p.dir+Math.random()*8-4,vy:-22,
          g:-6,life:1.2,max:1.2,col:'#c8ccd4',s:2.6});
      }
    }
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const pt=G.parts[i];
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=pt.g*dt;pt.life-=dt;
    if(pt.life<=0)G.parts.splice(i,1);
  }
  for(let i=G.quips.length-1;i>=0;i--){
    G.quips[i].t+=dt;
    if(G.quips[i].t>G.quips[i].dur)G.quips.splice(i,1);
  }
  for(let i=G.pops.length-1;i>=0;i--){
    G.pops[i].t+=dt;
    if(G.pops[i].t>.8)G.pops.splice(i,1);
  }
  for(const r of G.rainDrops){
    r.y+=r.v*dt;r.x+=60*dt;
    if(r.y>H){r.y=-8;r.x=Math.random()*W;}
    if(r.x>W)r.x-=W;
  }
  let target=clamp(p.x-W*.45,0,G.lv.len-W);
  if(G.waveActive)target=Math.min(target,G.lockX);
  cam.x+=(target-cam.x)*Math.min(1,dt*6);
  const maxX=G.waveActive?G.lockX+W-16:G.lv.len-8;
  p.x=clamp(p.x,cam.x+16,Math.min(cam.x+W-16,maxX));
  if(!G.waveActive&&G.waveIdx<G.lv.waves.length&&cam.x+W*.8>G.lv.waves[G.waveIdx].x)spawnWave();
  if(G.waveActive&&G.enemies.length===0){G.waveActive=false;G.waveIdx++;}
  if(p.state==='down'&&G.deadTimer>0){
    G.deadTimer-=dt;
    if(G.deadTimer<=0){
      if(G.lives>0){
        p.hp=10;p.state='idle';p.stateT=0;p.iframes=2.5;
        p.x=clamp(p.x,cam.x+50,cam.x+W-50);
      }else{G.state='gameover';AU.set(null);}
    }
  }
  if(!G.waveActive&&G.waveIdx>=G.lv.waves.length&&p.x>G.lv.len-96){
    if(G.lv.home){G.state='win';AU.set(null);AU.jing(true);}
    else{G.state='clear';G.score+=1000*(G.level+1);AU.set(null);AU.jing(true);}
  }
}

function drawRange(baseY,seed,col,snow,amp){
  const rng=mulberry(seed);
  const peaks=[];
  let x=-30;
  while(x<W+60){
    const w=36+rng()*48,h=amp*(.35+rng()*.65);
    peaks.push({x,w,h});
    x+=w*.86;
  }
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(-30,baseY+6);
  for(const p of peaks){
    g.lineTo(p.x,baseY-p.h);
    g.lineTo(p.x+p.w,baseY-p.h*.22);
  }
  g.lineTo(W+60,baseY+6);
  g.closePath();g.fill();
  g.fillStyle=snow;
  for(const p of peaks){
    if(p.h<amp*.45)continue;
    const sh2=p.h*.42,px=p.x,py=baseY-p.h;
    g.beginPath();
    g.moveTo(px,py);
    g.lineTo(px+p.w*.3,py+sh2);
    g.lineTo(px+p.w*.19,py+sh2*.72);
    g.lineTo(px+p.w*.1,py+sh2);
    g.lineTo(px+p.w*.02,py+sh2*.8);
    g.closePath();g.fill();
  }
}
function drawTower(x,baseY){
  g.strokeStyle='#1c1428';g.lineWidth=2.4;g.lineCap='round';
  g.beginPath();
  g.moveTo(x-7,baseY);g.lineTo(x-1.4,baseY-78);
  g.moveTo(x+7,baseY);g.lineTo(x+1.4,baseY-78);

  g.lineWidth=1.2;
  for(let i=1;i<6;i++){
    const t2=i/6,y=baseY-78*t2,w=7-5.6*t2;
    g.beginPath();g.moveTo(x-w,y);g.lineTo(x+w,y);g.stroke();

  g.fillStyle='#1c1428';rr(g,x-9,baseY-84,18,7,2);g.fill();

  txt('© ПЕРВЫЙ РАЙОН 1991 · АЛМАТА',W/2,262,'500 12px Rubik, sans-serif','#a89878');
  vignette();
}
function renderSelect(){
  drawBG(G.selLv,60);
  g.fillStyle='rgba(8,8,16,.78)';g.fillRect(0,0,W,H);
  txt(G.level>0?'СМЕНА БОЙЦА':'ВЫБОР БОЙЦА',W/2,26,'900 26px Rubik, sans-serif','#f0e8d0','center','middle',6);
  const h=HEROES[G.selIdx];
  g.fillStyle='#2a2a38';rr(g,30,198,166,8,4);g.fill();
  g.fillStyle='rgba(255,255,255,.1)';rr(g,30,198,166,2.4,1.2);g.fill();
  drawFighter(g,{x:112,y:198,dir:1,state:'idle',t:G.time,
    pal:h.pal,build:h.build,feat:h.feat,prop:h.prop,dur:.3,scale:2});
  txt(h.name,34,222,'900 22px Rubik, sans-serif','#f0e8d0','left','middle',5);
  txt('СУПЕР: '+h.superDesc,34,242,'700 12px Rubik, sans-serif','#a8a8b8','left','middle');
  txt('«'+h.quips[0]+'» / «'+h.quips[1]+'»',34,258,'800 13px Rubik, sans-serif','#ffe060','left','middle',3);
  for(let i=0;i<HEROES.length;i++){
    const sel=i===G.selIdx;
    txt((sel?'▸ ':'')+HEROES[i].name,250,54+i*26,
      sel?'800 17px Rubik, sans-serif':'700 13px Rubik, sans-serif',
      sel?'#ffe060':'#6a6a7a','left','middle');
  }
  txt('ПОСЛЕ СМЕНЫ — ПОЛНЫЙ ЛАЙФБАР',250,196,'500 11px Rubik, sans-serif','#5a5a68','left','middle');
  if(G.time%1.2<.75)
    txt(EN+' — ВЫБРАТЬ',W/2,H-18,'900 17px Rubik, sans-serif','#ffe060','center','middle',5);
  vignette();
}
function renderBanner(){
  renderWorld();
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);
  txt('РАЙОН '+(G.level+1),W/2,98,'900 30px Rubik, sans-serif','#f0e8d0','center','middle',7);
  txt(G.lv.name,W/2,128,'900 26px Rubik, sans-serif','#ffe060','center','middle',6);
  txt('ДОБЕРИСЬ ДО ДОМА И ИДИ ВПРАВО',W/2,158,'700 12px Rubik, sans-serif','#a8a8b8','center','middle');
  if(G.level===0)
    txt('НАБЕРИ 150 000 ₸ НА АРЕНДУ ДОМА',W/2,180,'800 13px Rubik, sans-serif','#6ee87a','center','middle',4);
}
function renderClear(){
  renderWorld();
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);
  txt('РАЙОН ПРОЙДЕН',W/2,92,'900 30px Rubik, sans-serif','#58c830','center','middle',7);
  txt('БОНУС РАЙОНА: +'+fmtT(1000*(G.level+1))+' ₸',W/2,124,'800 15px Rubik, sans-serif','#6ee87a','center','middle',4);
  txt('КАПИТАЛ: '+fmtT(G.score)+' ₸',W/2,148,'800 21px Rubik, sans-serif','#ffe060','center','middle',5);
  txt('ОСТАЛОСЬ РАЙОНОВ: '+(5-G.level),W/2,174,'700 13px Rubik, sans-serif','#a8a8b8','center','middle');
  if(G.time%1.2<.75)
    txt(EN+' — ДАЛЬШЕ',W/2,202,'900 17px Rubik, sans-serif','#ffe060','center','middle',5);
}
function renderGameOver(){
  g.fillStyle='#0a0a10';g.fillRect(0,0,W,H);
  txt('ИГРА ОКОНЧЕНА',W/2,90,'900 38px Rubik, sans-serif','#d83030','center','middle',9);
  txt('КАПИТАЛ: '+fmtT(G.score)+' ₸',W/2,146,'800 21px Rubik, sans-serif','#c8c8d4','center','middle',5);
  if(G.time%1.2<.75)
    txt(EN+' — ПРОДОЛЖИТЬ',W/2,186,'900 17px Rubik, sans-serif','#ffe060','center','middle',5);
}
function renderWin(){
  const L=G.lv,camw=L.len-W-10;
  drawBG(L,camw);
  drawFighter(g,{x:70,y:206,dir:1,state:'guitarPlay',t:G.time,
    pal:HEROES[0].pal,build:HEROES[0].build,feat:HEROES[0].feat,prop:'guitar',dur:.3,scale:1});
  drawGuitar(g,80,182,116,148);
  drawFighter(g,{x:124,y:206,dir:1,state:'bassPlay',t:G.time,
    pal:HEROES[1].pal,build:HEROES[1].build,feat:HEROES[1].feat,prop:'tree',dur:.3,scale:1});
  drawBass(g,134,182,174,144);
  drawFighter(g,{x:182,y:206,dir:1,state:'pet',t:G.time,
    pal:HEROES[2].pal,build:HEROES[2].build,feat:HEROES[2].feat,prop:'dog',dur:.3,scale:1});
  drawDogEnt({x:212,y:206,dir:1,phase:0,state:'sit',alpha:1,big:true,wag:true},212);
  drawFighter(g,{x:250,y:206,dir:1,state:'rap',t:G.time,
    pal:HEROES[3].pal,build:HEROES[3].build,feat:HEROES[3].feat,prop:'fists',dur:.3,scale:1});
  for(let k=0;k<3;k++){
    const rrr=5+k*6+Math.sin(G.time*4+k)*2;
    g.strokeStyle=`rgba(255,224,96,${(.45-k*.12).toFixed(2)})`;
    g.lineWidth=1.6;
    g.beginPath();
    g.arc(268,178,rrr,-.6,.6);
    g.stroke();
  }
  for(const pt of G.parts){
    if(pt.note)drawNote(pt.x-camw,pt.y,pt.col,clamp(pt.life/pt.max,0,1));
    else{
      g.globalAlpha=clamp(pt.life/pt.max,0,1)*.8;
      g.fillStyle=pt.col;
      el(g,pt.x-camw,pt.y,pt.s,pt.s);g.fill();
    }
  }
  g.globalAlpha=1;
  levelTint(L);
  vignette();
  txt('ВЫ ДОМА!',W/2,38,'900 40px Rubik, sans-serif','#ffe060','center','middle',9);
  if(G.score>=RENT){
    txt('АРЕНДА ОПЛАЧЕНА: 150 000 ₸',W/2,66,'800 15px Rubik, sans-serif','#6ee87a','center','middle',4);
    txt('ОСТАЛОСЬ: '+fmtT(G.score-RENT)+' ₸',W/2,88,'800 21px Rubik, sans-serif','#e8e8f0','center','middle',5);
  }else{
    txt('НАБРАНО: '+fmtT(G.score)+' ₸ ИЗ 150 000',W/2,78,'800 15px Rubik, sans-serif','#d8c030','center','middle',4);
  }
  if(G.time%1.2<.75)
    txt(EN+' — В НАЧАЛО',W/2,114,'900 17px Rubik, sans-serif','#f0e8d0','center','middle',5);
}
function renderPause(){
  renderWorld();drawHUD();
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);
  txt('ПАУЗА',W/2,116,'900 38px Rubik, sans-serif','#f0e8d0','center','middle',9);
  txt(isCoarse?EN+' — ПРОДОЛЖИТЬ':EN+' — ПРОДОЛЖИТЬ · M — ЗВУК',W/2,158,
    '700 13px Rubik, sans-serif','#a8a8b8','center','middle');
}
function render(){
  const S=cv.__S||1;
  g.setTransform(S,0,0,S,0,0);
  g.clearRect(0,0,W,H);
  switch(G.state){
    case 'title':renderTitle();break;
    case 'select':renderSelect();break;
    case 'banner':renderBanner();break;
    case 'play':renderWorld();drawHUD();break;
    case 'pause':renderPause();break;
    case 'clear':renderClear();break;
    case 'gameover':renderGameOver();break;
    case 'win':renderWin();break;
  }
}

/* ---------------- ГЛАВНЫЙ ЦИКЛ ---------------- */
function reset(){
  G.state='title';G.score=0;G.lives=6;G.level=0;G.selIdx=0;
  G.lv=buildLevel(0);G.parts=[];G.quips=[];G.pops=[];
  G._tsky=null;G.jointT=0;
  initTitleScene();
  AU.set('title');
}
function update(dt){
  G.time+=dt;
  syncBody();
  if(press('MU'))AU.toggle();
  switch(G.state){
    case 'title':
      if(press('ST')){G.selLv=buildLevel(0);G.state='select';AU.confirm();}
      break;
    case 'select':
      if(press('U')){G.selIdx=(G.selIdx+HEROES.length-1)%HEROES.length;AU.blip();}
      if(press('D')){G.selIdx=(G.selIdx+1)%HEROES.length;AU.blip();}
      if(press('ST')){
        AU.confirm();
        G.player=mkPlayer(HEROES[G.selIdx]);
        initLevel(G.level);
        G.state='banner';G.bannerT=0;
        AU.set(levelMusic());
      }
      break;
    case 'banner':
      G.bannerT+=dt;
      if(G.bannerT>2.4||press('ST'))G.state='play';
      break;
    case 'play':
      if(press('PA')||press('ST')){G.state='pause';break;}
      updatePlay(dt);
      break;
    case 'pause':
      if(press('PA')||press('ST'))G.state='play';
      break;
    case 'clear':
      if(press('ST')){
        G.level++;
        G.selLv=buildLevel(G.level);
        G.state='select';AU.set('title');AU.confirm();
      }
      break;
    case 'gameover':
      if(press('ST')){
        G.lives=6;G.player.hp=10;G.player.meter=0;
        initLevel(G.level);
        G.state='banner';G.bannerT=0;
        AU.set(levelMusic());
      }
      break;
    case 'win':
      G.noteT-=dt;
      if(G.noteT<=0){
        G.noteT=.4;
        G.parts.push({x:76+Math.random()*12,y:166,vx:12+Math.random()*12,vy:-12,
          g:-3,life:1.7,max:1.7,col:'#f0e8d0',s:3,note:true});
        G.parts.push({x:132+Math.random()*10,y:162,vx:10+Math.random()*10,vy:-14,
          g:-3,life:1.7,max:1.7,col:'#f0e8d0',s:3,note:true});
      }
      for(let i=G.parts.length-1;i>=0;i--){
        const pt=G.parts[i];
        pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=pt.g*dt;pt.life-=dt;
        if(pt.life<=0)G.parts.splice(i,1);
      }
      if(press('ST'))reset();
      break;
  }
  AU.tick();
  for(const k in hit)hit[k]=0;
}
reset();
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;acc+=dt;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();
}
requestAnimationFrame(frame);
</script>
